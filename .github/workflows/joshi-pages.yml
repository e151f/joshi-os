name: Deploy JOSHI OS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: joshi-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout JOSHI OS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap from ELIF OS
        if: ${{ !hashFiles('JOSHI-OS-BOOTSTRAPPED') }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elif-os
          git clone --depth 1 https://github.com/e151f/elif-os.git /tmp/elif-os
          rsync -a --delete --exclude='.git/' --exclude='.github/' /tmp/elif-os/ ./
          rm -f placeholder.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>ELIF OS //</title>','<title>JOSHI OS //</title>')
          p.write_text(s)
          m=Path('manifest.webmanifest')
          if m.exists():
              t=m.read_text().replace('ELIF OS','JOSHI OS')
              m.write_text(t)
          PY
          printf 'JOSHI OS bootstrapped from ELIF OS on %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > JOSHI-OS-BOOTSTRAPPED
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bootstrap JOSHI OS from ELIF OS' || true
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
